<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — ROOMCHECK</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">

<nav class="navbar navbar-expand-lg site-navbar">
    <div class="container">
        <a class="navbar-brand navbar-brand-text" href="index.html">ROOM<span>CHECK</span></a>
        <div class="ms-auto">
            <a href="login.html" class="btn-nav-login" style="background:transparent; border:1px solid rgba(255,255,255,0.2); color:#cbd5e1;">Login</a>
        </div>
    </div>
</nav>

<div class="auth-container">
    <div class="auth-card" style="max-width:500px;">
        <div class="auth-logo">
            <div class="auth-logo-text">ROOM<span>CHECK</span></div>
        </div>
        <h1 class="auth-heading">Create Your Account</h1>
        <p class="auth-subheading">Join ROOMCHECK to search and reserve rooms on campus.</p>

        <form action="login.html" method="get">
            <div class="mb-3">
                <label class="form-label-rc" for="fullname">Full Name</label>
                <input type="text" id="fullname" class="form-control-rc" placeholder="e.g. Sayeed Islam">
            </div>
            <div class="mb-3">
                <label class="form-label-rc" for="reg-email">Email Address</label>
                <input type="email" id="reg-email" class="form-control-rc" placeholder="you@university.edu">
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label-rc" for="student-id">Student / Faculty ID</label>
                    <input type="text" id="student-id" class="form-control-rc" placeholder="e.g. 2021-CSE-045">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label-rc" for="account-type">Account Type</label>
                    <select id="account-type" class="form-select-rc">
                        <option value="">Select type</option>
                        <option>Student</option>
                        <option>Faculty</option>
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label-rc" for="reg-password">Password</label>
                <input type="password" id="reg-password" class="form-control-rc" placeholder="Create a strong password">
            </div>
            <div class="mb-4">
                <label class="form-label-rc" for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" class="form-control-rc" placeholder="Repeat your password">
            </div>
            <button type="submit" class="btn-search">Create Account</button>
        </form>

        <hr class="auth-divider">
        <p class="auth-footer-text">Already have an account? <a href="login.html">Login</a></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
