<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — ROOMCHECK</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<nav class="site-navbar">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center w-100">
            <a class="navbar-brand-text" href="index.html">ROOM<span>CHECK</span></a>
            <div class="d-flex gap-4 align-items-center">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="search.html">Find a Room</a>
                <a class="nav-link" href="routine.html">Routine</a>
                <a class="btn-rc-primary" href="login.html" style="padding: 6px 16px;">Login</a>
            </div>
        </div>
    </div>
</nav>

<main class="auth-page">
    <div class="auth-card" style="max-width: 500px;">
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join ROOMCHECK today</p>
        
        <form action="login.html" method="GET">
            <div class="mb-3">
                <label class="form-label-rc">Full Name</label>
                <input type="text" class="form-control-rc" required>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label-rc">Student/Faculty ID</label>
                    <input type="text" class="form-control-rc" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label-rc">Account Type</label>
                    <select class="form-select-rc">
                        <option>Student</option>
                        <option>Faculty</option>
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label-rc">Email Address</label>
                <input type="email" class="form-control-rc" required>
            </div>
            <div class="mb-3">
                <label class="form-label-rc">Password</label>
                <input type="password" class="form-control-rc" required>
            </div>
            <div class="mb-4">
                <label class="form-label-rc">Confirm Password</label>
                <input type="password" class="form-control-rc" required>
            </div>
            
            <button type="submit" class="btn-primary-main w-100 mb-3" style="padding: 14px;">Create Account</button>
        </form>
        
        <div class="auth-footer-text mt-4">
            Already have an account? <a href="login.html" style="font-weight: 600;">Login here</a>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
