version: "3.9"

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roomcheck_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://roomcheck_user:${DB_PASSWORD}@db:5432/roomcheck?sslmode=disable"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"
      BCRYPT_ROUNDS: 12
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
    networks:
      - roomcheck_internal
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /tmp/roomcheck:/tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',(r)=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16-alpine
    container_name: roomcheck_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: roomcheck_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: roomcheck
    networks:
      - roomcheck_internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomcheck_user -d roomcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.25-alpine
    container_name: roomcheck_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - roomcheck_internal
    depends_on:
      - app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  roomcheck_internal:
    driver: bridge
    internal: false

volumes:
  postgres_data:
