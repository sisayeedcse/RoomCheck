<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ROOMCHECK</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="auth-card mx-auto">
        <div class="text-center mb-4">
            <a href="index.html" class="navbar-brand-text d-block mb-1" style="font-size: 24px;">ROOM<span>CHECK</span></a>
            <div style="font-size: 11px; font-weight: 700; color: #f59e0b; text-transform: uppercase; letter-spacing: 1px;">CSE Department</div>
        </div>
        
        <h1 class="auth-title" style="margin-top:30px;">Student Login</h1>
        <p class="auth-subtitle">Use your university ID to access the system.</p>
        
        <form action="dashboard.html" method="get">
            <div class="mb-3">
                <label class="form-label-rc" for="email">University Email</label>
                <input type="email" id="email" class="form-control-rc" placeholder="student@cse.edu" required>
            </div>
            <div class="mb-4">
                <label class="form-label-rc" for="password">Password</label>
                <input type="password" id="password" class="form-control-rc" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary-main w-100">Sign In to Dashboard</button>
        </form>

        <hr class="auth-divider">
        <p class="auth-footer-text">Don't have an account? <a href="register.html" style="font-weight: 600;">Sign up</a></p>
    </div>

</body>
</html>
