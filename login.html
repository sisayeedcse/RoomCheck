<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ROOMCHECK</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<nav class="site-navbar">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center w-100">
            <a class="navbar-brand-text" href="index.html">ROOM<span>CHECK</span></a>
            <div class="d-flex gap-4 align-items-center">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="search.html">Find a Room</a>
                <a class="nav-link" href="routine.html">Routine</a>
                <a class="btn-rc-primary" href="login.html" style="padding: 6px 16px;">Login</a>
            </div>
        </div>
    </div>
</nav>

<main class="auth-page">
    <div class="auth-card">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Login to your ROOMCHECK account</p>
        
        <form action="dashboard.html" method="GET">
            <div class="mb-3">
                <label class="form-label-rc">Email Address</label>
                <input type="email" class="form-control-rc" required>
            </div>
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label-rc mb-0">Password</label>
                    <a href="#" style="font-size: 12px; font-weight: 500;">Forgot password?</a>
                </div>
                <input type="password" class="form-control-rc" required>
            </div>
            <div class="mb-4 form-check" style="font-size: 14px; color: #64748b;">
                <input type="checkbox" class="form-check-input" id="remember">
                <label class="form-check-label" for="remember">Remember me</label>
            </div>
            
            <button type="submit" class="btn-primary-main w-100 mb-3" style="padding: 14px;">Login</button>
        </form>
        
        <div class="auth-footer-text mt-4">
            Don't have an account? <a href="register.html" style="font-weight: 600;">Create an account</a>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
